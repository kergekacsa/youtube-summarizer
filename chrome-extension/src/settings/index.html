<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Summarizer — Settings</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main>
      <h1>Settings</h1>

      <section class="field-group">
        <label for="api-key">Anthropic API key</label>
        <input
          id="api-key"
          type="password"
          placeholder="sk-ant-…"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="key-actions">
          <button id="test-key" type="button">Test key</button>
          <span id="key-status" class="key-status" role="status"></span>
        </div>
      </section>

      <section class="field-group">
        <label for="model">Model</label>
        <select id="model"></select>
      </section>

      <div class="save-row">
        <button id="save" type="button">Save</button>
        <span id="save-status" class="save-status" role="status"></span>
      </div>
    </main>
    <script type="module" src="./settings.ts"></script>
  </body>
</html>
