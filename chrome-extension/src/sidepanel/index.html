<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Summarizer</title>
    <link rel="stylesheet" href="./sidepanel.css" />
  </head>
  <body>
    <main id="app">
      <header class="bar">
        <h1>Summarize</h1>
        <div class="bar-actions">
          <button id="summarize" type="button">Summarize this video</button>
          <button id="settings-btn" type="button" class="icon-btn" title="Settings" aria-label="Open settings">⚙</button>
        </div>
      </header>

      <p id="no-key" class="no-key" hidden>
        <a id="open-settings" href="#" role="button">Add your API key in settings</a> to summarize.
      </p>

      <p id="video-meta" class="video-meta" hidden></p>
      <p id="status" class="status" role="status"></p>
      <section id="output" class="output"></section>
    </main>
    <script type="module" src="./sidepanel.ts"></script>
  </body>
</html>
