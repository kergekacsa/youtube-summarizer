<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Summarizer</title>
    <link rel="stylesheet" href="./sidepanel.css" />
  </head>
  <body>
    <main id="app">
      <header class="bar">
        <h1>Summarize</h1>
        <button id="summarize" type="button">Summarize this video</button>
      </header>

      <details id="settings-row" class="settings-row">
        <summary>Settings</summary>
        <label for="api-key">API key</label>
        <input
          id="api-key"
          type="password"
          placeholder="sk-ant-…"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="key-actions">
          <button id="test-key" type="button">Test API key</button>
          <span id="key-status" class="key-status" role="status"></span>
        </div>
        <div class="model-row">
          <label for="model">Model</label>
          <select id="model"></select>
        </div>
      </details>

      <p id="video-meta" class="video-meta" hidden></p>
      <p id="status" class="status" role="status"></p>
      <details id="debug-block" class="debug-block" hidden>
        <summary>Debug info</summary>
        <pre id="debug-pre" class="debug-pre"></pre>
      </details>
      <section id="output" class="output"></section>
      <button id="regenerate" type="button" hidden>Regenerate</button>
    </main>
    <script type="module" src="./sidepanel.ts"></script>
  </body>
</html>
